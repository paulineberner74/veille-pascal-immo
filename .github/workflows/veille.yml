name: Veille des prix du site

on:
  schedule:
    # 4 passages par jour (heures UTC ; Paris = +1 h en hiver) : GitHub lance
    # souvent ses tâches avec plusieurs heures de retard, 4 créneaux
    # garantissent au moins 2 relevés par jour
    - cron: "41 4 * * *"
    - cron: "41 9 * * *"
    - cron: "41 13 * * *"
    - cron: "41 18 * * *"
  workflow_dispatch: {}      # bouton "Run workflow" pour lancer à la main

permissions:
  contents: write

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lire les annonces du site
        run: python veille_site.py

      - name: Enregistrer les changements
        run: |
          git config user.name "veille-pascal-immo"
          git config user.email "veille@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Aucun changement"
          else
            git commit -m "Veille du $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi
