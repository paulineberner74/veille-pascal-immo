name: Veille des prix du site

on:
  schedule:
    # 2 passages par jour (heures UTC) : ~7h40 et ~13h40 à Paris en hiver
    - cron: "41 6 * * *"
    - cron: "41 12 * * *"
  workflow_dispatch: {}      # bouton "Run workflow" pour lancer à la main

permissions:
  contents: write

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lire les annonces du site
        run: python veille_site.py

      - name: Enregistrer les changements
        run: |
          git config user.name "veille-pascal-immo"
          git config user.email "veille@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Aucun changement"
          else
            git commit -m "Veille du $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi
